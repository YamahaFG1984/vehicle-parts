# 服务器部署：docker compose up -d --build
# 通过 Cloudflare Tunnel 发布到外网：在 .env 设置 DJANGO_PUBLIC_HOSTNAME 与 CLOUDFLARE_TUNNEL_TOKEN，
#   docker compose --profile tunnel up -d --build
#   （Cloudflare 控制台中该隧道的 Public Hostname 指向 http://web:8000）
# 本机开发不需要启动本文件，直接 `uv run python manage.py runserver` 连接已有 PostgreSQL 即可。
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vehicle_parts}
      POSTGRES_USER: ${POSTGRES_USER:-vehicle_parts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-vehicle_parts}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vehicle_parts}
      DJANGO_MEDIA_ROOT: /app/media
      VP_EXPORT_DIR: /app/exports
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Only on this machine: the public site is reached through the Cloudflare Tunnel.
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - media:/app/media   # 原始文件归档：必须与数据库一起备份

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]          # only with: docker compose --profile tunnel up -d
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

volumes:
  pgdata:
  media:
