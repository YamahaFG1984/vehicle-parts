{% extends "base.html" %}
{% block title %}导入 · 零件资料归一化{% endblock %}
{% block content %}
<h1>导入资料</h1>
<form class="box" method="post" enctype="multipart/form-data">{% csrf_token %}
  {{ form.as_p }}
  <button type="submit">上传并预览</button>
  <p class="muted">上传后先进入预览：查看识别出的表头与列映射、可以调整，确认后才入库。原件按 sha256 归档、不会覆盖；内容相同且已成功导入的文件会被识别为重复。</p>
</form>
<h2>导入批次</h2>
{% include "ingestion/_batch_table.html" %}
{% endblock %}
