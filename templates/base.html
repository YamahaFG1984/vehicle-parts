{% load static %}<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}零件资料归一化{% endblock %}</title>
<link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<header class="top"><div class="inner">
  <a class="brand" href="{% url 'catalog:dashboard' %}">零件资料归一化</a>
  <form class="search" action="{% url 'catalog:search' %}" method="get">
    <input type="search" name="q" value="{{ q|default:'' }}" placeholder="编号 / OE / 关键词 / 供应商">
  </form>
  <nav>
    <a href="{% url 'catalog:search' %}?state=已确认归一">产品</a>
    <a href="{% url 'matching:group_queue' %}">复核队列</a>
    <a href="{% url 'matching:issue_list' %}">异常</a>
    <a href="{% url 'ingestion:batch_list' %}">导入</a>
    <a href="{% url 'admin:index' %}">Admin</a>
    {% if user.is_authenticated %}<span class="muted">· {{ user.get_username }}</span>{% endif %}
  </nav>
</div></header>
<main>
{% if messages %}<ul class="messages">{% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}</ul>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
